<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" role="img" aria-label="Carl Rogers Counselling and Therapy Centre Logo">
  <defs>
    <linearGradient id="crctGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174C45"/>
      <stop offset="100%" stop-color="#4D8978"/>
    </linearGradient>
    <linearGradient id="crctAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9BD87"/>
      <stop offset="100%" stop-color="#D49E5B"/>
    </linearGradient>
  </defs>

  <!-- Emblem Mark -->
  <g transform="translate(10, 5)">
    <!-- Outer Ring with Tagline hint -->
    <circle cx="40" cy="40" r="38" fill="#F7F4EC" stroke="#174C45" stroke-width="2"/>
    <circle cx="40" cy="40" r="33" fill="none" stroke="#D8E8E0" stroke-width="1.5" stroke-dasharray="3 2"/>
    
    <!-- Radiating gentle arcs / neurodiversity spectrum -->
    <path d="M 20 40 A 20 20 0 0 1 60 40" fill="none" stroke="#7A5299" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 24 40 A 16 16 0 0 1 56 40" fill="none" stroke="#4D8978" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 40 A 12 12 0 0 1 52 40" fill="none" stroke="#E9BD87" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gentle Cradling Hands / Heart of Care -->
    <path d="M 22 47 C 28 58 38 62 40 62 C 42 62 52 58 58 47" fill="none" stroke="#174C45" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Central Empowered Human Figure (Rogers Humanistic Emblem) -->
    <circle cx="40" cy="30" r="4.5" fill="#174C45"/>
    <path d="M 40 36 L 40 54 M 32 42 L 48 42" stroke="#174C45" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Small spark/star of clarity -->
    <circle cx="40" cy="20" r="2" fill="#E9BD87"/>
  </g>

  <!-- Typography -->
  <text x="100" y="32" font-family="'Lora', Georgia, serif" font-size="24" font-weight="700" fill="#174C45" letter-spacing="1.5">CRCT</text>
  <text x="100" y="50" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#26332F" letter-spacing="0.5">CARL ROGERS COUNSELLING &amp; THERAPY CENTRE</text>
  <text x="100" y="66" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#4D8978" letter-spacing="1.2">ENLIGHTENING THOUGHTS &amp; EQUALISING EMOTIONS</text>
  <text x="100" y="79" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#6A7A75">Govt. Regd: 45134335 • Visakhapatnam</text>
</svg>
